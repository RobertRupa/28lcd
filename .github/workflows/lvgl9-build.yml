name: LVGL 9 ESP32-S3 Build
on:
  push:
    branches: [feature/lvgl9-modern-dark]
  pull_request:
    branches: [master]
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio
      - run: pio run -e es3c28p
