name: Build ESP32 firmware
on:
  push:
    branches: [feature/lvgl-dashboard]
  pull_request:
    branches: [master]
jobs:
  es3c28p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio
      - run: pio run -e es3c28p
  coprocessor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coprocessor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio
      - run: pio run -e xiao_esp32c6
