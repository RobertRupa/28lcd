[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
  -DLINK_RX_GPIO=6
  -DLINK_TX_GPIO=7
  -DRELAY_GPIO=-1
; RELAY_GPIO=-1 means physical relay output is disabled.
; Adjust UART RX/TX and RELAY_GPIO to your validated wiring.
