[platformio]
default_envs = es3c28p

[env:es3c28p]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_SKIP
  -DLV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
  -DLV_USE_OS=LV_OS_NONE
  -DLV_DEF_REFR_PERIOD=25
  -DLV_DPI_DEF=130
  -DLV_USE_LOG=0
  -DLV_FONT_MONTSERRAT_14=1
  -DLV_FONT_MONTSERRAT_16=1
  -DLV_FONT_MONTSERRAT_28=1
  -DCORE_DEBUG_LEVEL=1
  -Iinclude
lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  lvgl/lvgl@9.2.2
  adafruit/Adafruit NeoPixel@^1.12.3
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.15
  earlephilhower/ESP8266Audio@1.9.7
  bitbank2/JPEGDEC@^1.8.3

; Experimental Arduino 3.x + ESP-IDF 5.5 Matter build. Legacy environment above is retained.
[env:es3c28p_matter]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = partitions_matter_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_SKIP
  -DLV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
  -DLV_USE_OS=LV_OS_NONE
  -DLV_DEF_REFR_PERIOD=25
  -DLV_DPI_DEF=130
  -DLV_USE_LOG=0
  -DLV_FONT_MONTSERRAT_14=1
  -DLV_FONT_MONTSERRAT_16=1
  -DLV_FONT_MONTSERRAT_28=1
  -DCORE_DEBUG_LEVEL=1
  -DENABLE_28LCD_MATTER=1
  -Iinclude
lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  lvgl/lvgl@9.2.2
  adafruit/Adafruit NeoPixel@^1.12.3
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.15
  earlephilhower/ESP8266Audio@^1.9.8
  bitbank2/JPEGDEC@^1.8.3

